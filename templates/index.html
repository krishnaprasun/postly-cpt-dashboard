<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postly Performance</title>
<link rel="icon" type="image/svg+xml" href="/static/postly_icon_logo.svg">
<style>
/* Postly brand palette — values taken from postly-insta-daily/brandkit.py so the
   dashboard matches the creatives: cream ground, navy ink, green primary, gold
   secondary. Red is the one addition; the brand has none, so it is a muted brick
   chosen to sit with the gold rather than fight it. */
:root{
  --cream:#FDFCF7; --white:#FFFFFF; --panel2:#F6F4EC;
  --navy:#1A1C2E; --ink:#3A3E52; --muted:#787E91; --faint:#A8AEBE;
  --line:#E7E4DA; --line2:#F0EEE6;
  --green:#20A75D; --green-dk:#127A42; --green-lt:#EAF7F0;
  --gold:#E8A017; --gold-dk:#B87A08; --gold-lt:#FDF4E3;
  --red:#B3342C; --red-lt:#FBECEA;
  --shadow:0 1px 2px rgba(26,28,46,.05), 0 4px 14px rgba(26,28,46,.045);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--navy);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased}

header{position:sticky;top:0;z-index:20;background:rgba(253,252,247,.93);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 22px}
.hrow{display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:4px}
.brand svg{width:26px;height:26px;display:block;flex:none}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.1px;color:var(--navy)}
h1 em{font-style:normal;color:var(--green-dk)}
h1 span{color:var(--faint);font-weight:400;margin-left:5px;font-size:13px}
.spacer{flex:1}

.grp{display:flex;background:var(--white);border:1px solid var(--line);border-radius:9px;
  overflow:hidden;box-shadow:var(--shadow)}
.grp button{background:none;border:0;color:var(--ink);padding:6px 12px;font-size:12.5px;
  cursor:pointer;font-family:inherit;border-right:1px solid var(--line2);font-weight:500}
.grp button:last-child{border-right:0}
.grp button.on{background:var(--green);color:#fff;font-weight:650}
.grp button:hover:not(.on){background:var(--green-lt);color:var(--green-dk)}
.btn{background:var(--white);border:1px solid var(--line);color:var(--ink);border-radius:9px;
  padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:550;
  box-shadow:var(--shadow)}
.btn:hover{border-color:var(--green);color:var(--green-dk);background:var(--green-lt)}
.btn[disabled]{opacity:.45;cursor:default}
.meta{font-size:11.5px;color:var(--faint)}
.meta b{color:var(--ink);font-weight:600}

main{padding:20px 22px 60px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-bottom:20px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  box-shadow:var(--shadow)}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
  font-weight:650}
.kpi .v{font-size:28px;font-weight:680;margin-top:6px;letter-spacing:-.9px;
  font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:5px}
.kpi.hero{background:linear-gradient(150deg,var(--green-lt) 0%,var(--white) 62%);
  border-color:#CBE8D8;position:relative;overflow:hidden}
.kpi.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#0B9C5D,#38D993)}

.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:15px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  padding:9px 14px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:550;
  margin-bottom:-1px}
.tabs button.on{color:var(--green-dk);border-bottom-color:var(--green);font-weight:680}
.tabs button:hover:not(.on){color:var(--navy)}
.tabs button i{font-style:normal;color:var(--faint);font-size:11px;margin-left:5px;font-weight:500}

.ctl{display:flex;gap:11px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
input[type=search]{background:var(--white);border:1px solid var(--line);color:var(--navy);
  border-radius:9px;padding:6px 12px;font-size:12.5px;width:290px;font-family:inherit}
input[type=search]:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 3px var(--green-lt)}
label.chk{font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=checkbox]{accent-color:var(--green)}

.wrap{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:auto;
  max-height:70vh;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--panel2);text-align:right;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:9px 13px;
  border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:2;font-weight:700}
th:first-child,td:first-child{text-align:left}
/* Parent-name columns — campaign under ad set, account under campaign, ad set under ad.
   Their cells are left-aligned text but `th` defaults to right, so the header sat off to
   the right of the values it labelled. `.grow` also hands this column the row's spare
   width: with auto table layout the slack went to the widest column (the name), which
   pushed the parent name far right and left a gap between it and the row it belongs to. */
th.l{text-align:left}
th.grow{width:100%}
th:hover{color:var(--navy)}
th.sorted{color:var(--green-dk)}
td{padding:8px 13px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;
  color:var(--ink)}
td:first-child{color:var(--navy);font-weight:500}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--green-lt)}
td.name{text-align:left;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.sub{text-align:left;color:var(--faint);font-size:11.5px;max-width:260px;
  overflow:hidden;text-overflow:ellipsis;font-weight:400}
tfoot td{position:sticky;bottom:0;background:var(--panel2);font-weight:700;color:var(--navy);
  border-top:1px solid var(--line);border-bottom:0}
.pill{font-size:9.5px;padding:1.5px 7px;border-radius:20px;border:1px solid var(--line);
  color:var(--muted);margin-left:7px;background:var(--panel2);font-weight:600;
  text-transform:uppercase;letter-spacing:.4px}
.pill.live{color:var(--green-dk);border-color:#CBE8D8;background:var(--green-lt)}
.note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.65;max-width:1100px}
.note b{color:var(--ink)}
.err{background:var(--red-lt);border:1px solid #EFCFCB;color:var(--red);padding:12px 15px;
  border-radius:11px;margin-bottom:14px;font-size:13px}
/* A throttle is not a failure — the numbers are still on screen, they are just not
   moving. Amber and calm, not red and alarming. */
.warnbox{background:var(--gold-lt);border:1px solid #F0DDB4;color:var(--gold-dk);
  padding:10px 15px;border-radius:11px;margin-bottom:14px;font-size:12.5px}
.warnbox b{color:#8C5C05}
/* Progress bar shown while any fetch is in flight. The first load gets the big panel
   below as well; a background refresh gets only this, so the numbers on screen stay
   readable while they are being replaced. */
#bar{position:fixed;top:0;left:0;right:0;height:2.5px;z-index:50;background:transparent;
  opacity:0;transition:opacity .2s}
#bar.on{opacity:1}
#bar i{display:block;height:100%;width:35%;border-radius:0 3px 3px 0;
  background:linear-gradient(90deg,#0B9C5D,#38D993);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
/* Throttle banner. Amber and calm: a rate limit is not a failure, the numbers are still
   right, they are just not moving. It gets its own box above the general warnings
   because it is the one condition with a deadline attached. */
.limitbox{background:var(--gold-lt);border:1px solid #F0DDB4;border-radius:11px;
  padding:11px 15px;margin-bottom:14px;font-size:12.5px;color:var(--gold-dk)}
.limitbox b{color:#8C5C05}
.lhead{display:flex;align-items:center;gap:8px;font-weight:700;color:#8C5C05;font-size:13px}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;
  animation:pulse 1.4s ease-in-out infinite}
.lcd{margin-left:auto;background:var(--white);border:1px solid #F0DDB4;border-radius:20px;
  padding:2px 11px;font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;
  color:#8C5C05;white-space:nowrap}
.lbody{margin-top:7px;line-height:1.65}

/* Brand switcher. A segmented control next to the title rather than another select:
   which brand you are looking at changes every number on the page, so it has to be
   readable without opening anything, and obvious that it is not a filter. */
.brandsw{display:flex;gap:2px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;padding:2px;box-shadow:var(--shadow)}
.brandsw button{border:0;background:transparent;color:var(--dim);font:inherit;
  font-size:12.5px;font-weight:650;padding:5px 13px;border-radius:8px;cursor:pointer;
  letter-spacing:.01em}
.brandsw button:hover{color:var(--ink)}
.brandsw button.on{background:var(--white);color:var(--ink);box-shadow:var(--shadow)}

/* Range picker. A select rather than a button row: five fixed spans plus a custom range
   do not fit in the header as buttons, and the chosen range must stay readable at a
   glance rather than being one highlighted item in a strip. */
select.sel,input[type=date]{background:var(--white);border:1px solid var(--line);
  color:var(--ink);border-radius:9px;padding:6px 12px;font-size:12.5px;font-family:inherit;
  font-weight:550;cursor:pointer;box-shadow:var(--shadow)}
select.sel{appearance:none;-webkit-appearance:none;padding-right:29px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23787E91' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
select.sel:focus,input[type=date]:focus{outline:0;border-color:var(--green);
  box-shadow:0 0 0 3px var(--green-lt)}
#customWrap{display:none;gap:7px;align-items:center}
#customWrap.on{display:flex}
#customWrap span{font-size:12px;color:var(--faint)}

/* Loading veil. The page behind it is blurred rather than blanked so the shape of what
   is coming stays visible. Deliberately NOT shown for the 30-minute auto refresh or a
   tab-focus re-pull: blurring a table someone is reading, every half hour, would be a
   worse dashboard than a slightly stale one. Foreground actions only — first load,
   range change, manual Refresh. */
#veil{position:fixed;inset:0;z-index:40;display:none;align-items:flex-start;
  justify-content:center;padding:15vh 20px 0;background:rgba(253,252,247,.5);
  backdrop-filter:blur(10px) saturate(1.04);-webkit-backdrop-filter:blur(10px) saturate(1.04)}
body.veiled #veil{display:flex}
body.veiled main,body.veiled header{pointer-events:none;user-select:none}
.veilcard{width:min(430px,94vw);background:var(--white);border:1px solid var(--line);
  border-radius:18px;padding:24px 26px 22px;box-shadow:0 12px 44px rgba(26,28,46,.14);
  text-align:center;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.veilcard img{width:40px;height:40px;display:block;margin:0 auto 13px}
.veilcard .vt{font-size:16px;font-weight:680;letter-spacing:-.2px;color:var(--navy)}
.veilcard .vs{font-size:12.5px;color:var(--muted);margin-top:5px}
.vsrc{margin:17px 0 3px;text-align:left;display:grid;gap:8px}
.vsrc div{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink)}
.vdot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;
  animation:pulse 1.15s ease-in-out infinite}
.vsrc div:nth-child(2) .vdot{animation-delay:.22s}
.vsrc div:nth-child(3) .vdot{animation-delay:.44s}
@keyframes pulse{0%,100%{opacity:.28;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.vbar{height:3px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:16px}
.vbar i{display:block;height:100%;width:38%;border-radius:3px;
  background:linear-gradient(90deg,#0B9C5D,#38D993);animation:slide 1.15s ease-in-out infinite}
.vhint{font-size:11px;color:var(--faint);margin-top:11px;line-height:1.5}
.vel{font-variant-numeric:tabular-nums;color:var(--green-dk);font-weight:650}

/* Skeleton shown under the veil on a cold load, so the blur has the real layout behind
   it instead of an empty page. */
.skl{height:11px;border-radius:6px;
  background:linear-gradient(90deg,var(--line2) 25%,var(--panel2) 50%,var(--line2) 75%);
  background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

.spin{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;
  border:1.5px solid var(--green);border-right-color:transparent;border-radius:50%;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Semantic CPT colours come last on purpose. `.kpi .v`, `td` and `tfoot td` all set a
   colour of their own and out-specify a bare `.good`/`.bad`, which silently killed the
   colour coding the first time this was styled. Keep this block at the bottom. */
.good,   .kpi .v.good,   td.good,   tfoot td.good  {color:var(--green-dk)}
.warn,   .kpi .v.warn,   td.warn,   tfoot td.warn  {color:var(--gold-dk)}
.bad,    .kpi .v.bad,    td.bad,    tfoot td.bad   {color:var(--red)}
.dimtxt, .kpi .v.dimtxt, td.dimtxt, tfoot td.dimtxt{color:var(--faint)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="veil"><div class="veilcard">
  <img src="/static/postly_icon_logo.svg" alt="">
  <div class="vt">Pulling live numbers</div>
  <div class="vs" id="veilWin"></div>
  <div class="vsrc" id="veilSrc"></div>
  <div class="vbar"><i></i></div>
  <div class="vhint"><span class="vel" id="veilEl">0s</span> elapsed · a cold instance
    takes 15–30s to answer its first pull</div>
</div></div>
<header>
  <div class="hrow">
    <div class="brand"><svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">

</svg><h1><span id="bname">Postly</span> <em>Performance</em> <span id="win"></span></h1></div>
    <div class="brandsw" id="brandsw">{% for b in brands %}<button data-b="{{ b.key }}"{% if b.key == default_brand %} class="on"{% endif %}>{{ b.label }}</button>{% endfor %}</div>
    <select class="sel" id="range">
      <option value="today" selected>Today</option>
      <option value="yesterday">Yesterday</option>
      <option value="3d">Last 3 days</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
      <option value="custom">Custom range…</option>
    </select>
    <div id="customWrap">
      <input type="date" id="cSince"><span>→</span><input type="date" id="cUntil">
      <button class="btn" id="cGo">Apply</button>
    </div>
    <div class="spacer"></div>
    <div class="meta" id="stamp"></div>
    <button class="btn" id="refresh">Refresh</button>
  </div>
</header>

<main>
  <div id="limit"></div>
  <div id="err"></div>
  <div class="kpis" id="kpis"></div>

  <div class="tabs" id="tabs">
    <button data-t="combined" class="on">Combined</button>
    <button data-t="accounts">Ad accounts <i id="n-accounts"></i></button>
    <button data-t="campaigns">Campaigns <i id="n-campaigns"></i></button>
    <button data-t="adsets">Ad sets <i id="n-adsets"></i></button>
    <button data-t="ads">Ads <i id="n-ads"></i></button>
  </div>

  <div class="ctl" id="ctl">
    <input type="search" id="q" placeholder="Filter by name…">
    <label class="chk"><input type="checkbox" id="activeOnly" checked> active only</label>
    <label class="chk"><input type="checkbox" id="spentOnly"> spent &gt; 0 only</label>
    <label class="chk" id="cpWrap" style="display:none"><input type="checkbox" id="cpCols" checked> signups &amp; mandates</label>
    <span class="meta" id="rowcount"></span>
  </div>

  <div class="wrap"><table id="tbl"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
  <div class="note" id="note"></div>
</main>

<script>
/* CPT target for the brand on screen. null is a real value meaning "do not colour":
   an unagreed target is worse than none, because a red cell reads as an instruction. */
let T = null;
let BRAND = '{{ default_brand }}';
/* Enough about each brand to paint the loading veil honestly before any data has been
   fetched. The authoritative values still come from the payload. */
const BRANDS = {{ brand_meta | tojson }};
let DATA=null, RANGE='today', TAB='combined',
    /* The headline slot. Each brand maps it to its own Branch event in config.py —
       Postly's postly_trial_started_backend, Speakeasy's speakeasy_trial_started — so
       the page never has to know which brand it is showing. The second slot (t10m) is
       still fetched and rolled up; only the UI switch between them was removed. */
    EV='t101',
    SORT={key:'spend',dir:-1}, timer=null;
let CUSTOM = null;                   // {since, until} once a custom range is applied
const MAX_SPAN = 31;                 // days; Branch is fetched in 7-day chunks, so a
                                     // long range is many round trips, not one
/* Today in IST regardless of where the browser is — shifting the epoch by +5:30 and
   reading the UTC calendar date gives the IST wall-clock date. */
const istToday = () => new Date(Date.now() + 330*60000).toISOString().slice(0,10);
const apiQuery = () => `brand=${BRAND}&` + (CUSTOM
  ? `since=${CUSTOM.since}&until=${CUSTOM.until}` : `range=${RANGE}`);
const rangeLabel = () => CUSTOM
  ? (CUSTOM.since===CUSTOM.until ? CUSTOM.since : `${CUSTOM.since} → ${CUSTOM.until}`)
  : document.getElementById('range').selectedOptions[0].textContent;

const rs = n => '₹' + Math.round(n).toLocaleString('en-IN');
const num = n => Math.round(n).toLocaleString('en-IN');
/* No target -> no verdict. Every cost-per cell renders plain, which is the honest
   state for a brand whose "good" nobody has set yet. */
const cls = c => (T===null || c===null) ? 'dimtxt'
                 : (c<=T ? 'good' : c<=T*1.7 ? 'warn' : 'bad');
/* Whether this brand has a Branch app and named events. Without them there are no
   trials and therefore no CPT, so those columns and KPIs are removed rather than
   shown as zeros — a zero reads as "none happened", which is a different claim. */
const hasTrials = () => !!(DATA && DATA.events && DATA.events.length);
const cpt = (sp,tr) => tr>0 ? sp/tr : null;
const cptTxt = (sp,tr) => tr>0 ? rs(sp/tr) : (sp>0 ? 'no trials' : '—');
const pct = (n,d) => d>0 ? (100*n/d).toFixed(0)+'%' : '—';
/* Classplus columns show only when the query's own window matches the one on screen —
   see `classplus()` in postly_cpt.py. Never guess: a mandate count from another day
   sitting next to today's spend is worse than a blank column. */
const cpOn = () => !!(DATA && DATA.classplus && DATA.classplus.available
                      && document.getElementById('cpCols').checked);

/* ---------- fetch ---------- */
let staleTimer=null, BUSY=false, lastFetchAt=0, ticker=null;

/* How old the numbers on screen actually are: the server-side cache age when they were
   sent, plus the wall time since. Shown live so stale figures can never look current —
   the whole point of the dashboard is that the CPT is the one from a minute ago, not
   from whenever the tab happened to be opened. */
function ageSecs(){
  return DATA ? (DATA.age || 0) + Math.max(0, (Date.now() - lastFetchAt) / 1000) : null;
}
function ago(sec){
  if(sec < 45) return 'just now';
  if(sec < 5400) return Math.round(sec/60) + ' min ago';
  return (sec/3600).toFixed(1) + ' h ago';
}
function stampNow(){
  const el = document.getElementById('stamp');
  if(BUSY){ el.innerHTML = '<span class="spin"></span>refreshing…'; return; }
  if(!DATA){ el.textContent = ''; return; }
  const a = ageSecs();
  el.innerHTML = `Last refreshed <b>${DATA.generated_at.replace(' IST','')}</b> IST · ` +
                 `<span class="${a > 2100 ? 'warn' : ''}">${ago(a)}</span> · auto 30m`;
}

/* On a cold load there is nothing behind the veil to blur, so lay the real shape of the
   page down as skeletons first. Never replaces figures that are already on screen. */
function showSkeleton(){
  if(DATA) return;
  const bar = w => `<div class="skl" style="width:${w}"></div>`;
  document.getElementById('kpis').innerHTML = Array.from({length:5}, (_,i) =>
    `<div class="kpi${i?'':' hero'}">${bar('54%')}
       <div style="height:15px"></div>${bar('78%')}
       <div style="height:9px"></div>${bar('62%')}</div>`).join('');
  document.getElementById('tbl').querySelector('tbody').innerHTML =
    Array.from({length:9}, () =>
      `<tr>${Array.from({length:6}, (_,j) =>
        `<td>${bar(j?'58%':'86%')}</td>`).join('')}</tr>`).join('');
}

/* The veil blurs the page while a foreground pull runs. `silent` loads — the 30-minute
   auto refresh, a tab-focus re-pull, the follow-up after a stale response — never raise
   it: those happen while someone is reading and must not interrupt. */
let veilAt = 0, veilTick = null;
function veil(on){
  document.body.classList.toggle('veiled', on);
  clearInterval(veilTick); veilTick = null;
  if(!on) return;
  document.getElementById('veilWin').textContent = rangeLabel();
  /* Named per brand: listing Branch or Classplus while pulling a brand that has
     neither would promise numbers that are never going to arrive. */
  const B = BRANDS[BRAND] || {};
  document.getElementById('veilSrc').innerHTML =
    [`Meta — spend, budgets and statuses, ${B.accounts||'all'} ad account${B.accounts===1?'':'s'}`]
    .concat(B.branch ? ['Branch — trials by ad name'] : [])
    .concat(B.classplus ? ['Classplus — signups and trial mandates'] : [])
    .map(t => `<div><span class="vdot"></span>${t}</div>`).join('');
  veilAt = Date.now();
  document.getElementById('veilEl').textContent = '0s';
  veilTick = setInterval(() => {
    document.getElementById('veilEl').textContent =
      Math.round((Date.now()-veilAt)/1000) + 's';
  }, 1000);
}

/* `hard` additionally re-reads Meta's roster — names, statuses and BUDGETS — which is
   otherwise cached server-side for 30-60 min. Only the Refresh button and the throttle
   retry set it; the automatic 30-minute pull deliberately does not, because the ads
   listing is the most expensive call this makes. */
async function load(force, silent, hard){
  clearTimeout(staleTimer);
  BUSY = true;
  document.getElementById('bar').classList.add('on');
  document.getElementById('refresh').disabled = true;
  document.getElementById('refresh').textContent = 'Refreshing…';
  showSkeleton();
  if(!silent) veil(true);
  stampNow();
  try{
    const r = await fetch(`/api/data?${apiQuery()}${force?'&force=1':''}${hard?'&hard=1':''}`);
    const j = await r.json();
    lastFetchAt = Date.now();
    if(j.error){ document.getElementById('err').innerHTML =
      `<div class="err"><b>Could not load.</b> ${j.error}</div>`; return; }
    DATA = j; render();
    // Warnings still carry figures — render them, then explain what is off.
    const notes = [];
    if(j.warning && j.warning_kind !== 'rate_limit') notes.push(
      `<b>Numbers not refreshing.</b> ${j.warning}
       Last updated ${DATA.generated_at.replace(' IST','')} IST.`);
    // When the throttle banner is up it already names the accounts, the listings and
    // the deadline; repeating it here would just be two boxes saying the same thing.
    if(j.degraded && j.degraded.length && !(j.rate_limit && j.rate_limit.active)) notes.push(
      `<b>Partial data.</b> Meta would not return some listings — ` +
      j.degraded.map(d=>`<b>${d.account}</b>: ${d.missing.join(' + ')}`).join('; ') +
      `. Spend, trials and CPT are unaffected and correct.
       ${j.budgets_known ? '' : 'Budgets are unavailable, '}status shows
       <i>unknown</i> for the missing listings, and anything that spent nothing today is
       not listed. Retried on the next refresh.`);
    document.getElementById('err').innerHTML = notes.length
      ? `<div class="warnbox">${notes.join('<br><br>')}</div>` : '';
    // Served from a stale cache while a refresh runs behind the request — come back
    // for the fresh numbers instead of leaving old ones on screen.
    if(j.stale) staleTimer = setTimeout(()=>load(false, true), 12000);
  }catch(e){
    document.getElementById('err').innerHTML =
      `<div class="err"><b>Fetch failed.</b> ${e}</div>`;
  }finally{
    BUSY = false;
    veil(false);
    document.getElementById('bar').classList.remove('on');
    document.getElementById('refresh').disabled = false;
    document.getElementById('refresh').textContent = 'Refresh';
    stampNow();
  }
}

/* ---------- Meta rate limit ---------- */
/* The one condition on this page that comes with a deadline, so it gets a countdown and
   retries itself at the end of it. Everything stated here comes from Meta's own
   x-business-use-case-usage header — no estimate is invented, because the first version
   of this promised "a few minutes" and the throttle then ran for over half an hour. */
let rlDeadline = 0, rlTick = null, rlFired = 0;

const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

function renderLimits(){
  const box = document.getElementById('limit'), rl = DATA && DATA.rate_limit;
  clearInterval(rlTick); rlTick = null;
  if(!rl){ box.innerHTML = ''; return; }

  if(rl.active){
    const a = rl.accounts;
    const who = a.map(e => `<b>${e.account}</b> — ${e.listings.join(' + ')}`).join('; ');
    const held = Math.max(...a.map(e => e.held_min));
    const dev = (rl.budget[0]||{}).tier === 'development_access';
    const spendHit = a.some(e => e.listings.includes('spend'));
    box.innerHTML = `<div class="limitbox">
      <div class="lhead"><span class="ldot"></span>
        Meta is rate-limiting ${a.length>1 ? 'these ad accounts' : 'this ad account'}
        <span class="lcd" id="rlcd">—</span></div>
      <div class="lbody">${who}. Refused for ${held} min so far.
        ${rl.retry_source === 'meta'
          ? `Meta puts access back at <b>${rl.retry_at_ist} IST</b> and this page retries
             itself then — nothing to do.`
          : `Meta gives no recovery estimate on this endpoint, so there is no countdown to
             be had — this page re-checks every ${rl.recheck_min || 5} min (next at
             <b>${rl.retry_at_ist} IST</b>) and picks the data up the moment it clears.
             Nothing to do.`}
        ${spendHit
          ? `<br><b>Every figure below is the last one that came through</b> — the spend
             read was refused too, so nothing is moving until access returns.`
          : `<br><b>Spend, trials and CPT are current and correct</b> — insights are not
             throttled. What is held from the last successful read is
             ${DATA.budgets_known ? 'active/paused status' : 'budgets and active/paused status'}.`}
        ${rl.worst_time_pct ? `<br><span class="dimtxt">The limit being hit is request
          <b>time</b>, not call count — ${rl.worst_time_pct}% of the hourly time budget
          used against ${rl.budget[0].calls_pct}% of the call budget${dev
          ? `, on the <b>development access</b> tier. Standard Access lifts this ceiling.`
          : '.'}</span>` : ''}
      </div></div>`;
    rlDeadline = Date.now() + rl.retry_in_sec*1000;
    const tick = () => {
      const left = Math.max(0, Math.round((rlDeadline - Date.now())/1000));
      const el = document.getElementById('rlcd');
      if(el) el.textContent = left
        ? `${rl.retry_source === 'meta' ? 'back in' : 're-check in'} ${mmss(left)}`
        : 'retrying…';
      // Fire once per deadline. Retrying early does not work and blocked attempts still
      // count against the window, so an eager loop would keep the throttle alive.
      if(left <= 0 && rlDeadline !== rlFired){
        rlFired = rlDeadline;
        clearInterval(rlTick); rlTick = null;
        load(true, true, true);           // silent, but hard: re-reading the blocked
                                          // listing is the entire point of this retry
      }
    };
    tick(); rlTick = setInterval(tick, 1000);
    return;
  }

  // Not throttled — but total_time is what binds here, so say so on the way up rather
  // than only after it trips.
  const b = rl.budget[0];
  if(b && b.time_pct >= 85){
    box.innerHTML = `<div class="warnbox"><b>Close to Meta's limit.</b>
      ${b.account} has used <b>${b.time_pct}%</b> of its hourly request-<i>time</i> budget
      (call count is only ${b.calls_pct}%). Refreshes may start being refused shortly; if
      that happens this page will say so and recover on its own.</div>`;
    return;
  }
  box.innerHTML = '';
}

/* ---------- KPIs ---------- */
function kpis(){
  const c = DATA.combined, tr = c[EV], sp = c.spend, k = cpt(sp,tr);
  const trials = hasTrials();
  const cov = trials && DATA.branch_totals[EV]
    ? 100*DATA.matched[EV]/DATA.branch_totals[EV] : 0;
  const pace = c.budget ? 100*sp/c.budget : 0;
  const days = Math.round((new Date(DATA.until) - new Date(DATA.since))/864e5) + 1;
  // budgets and statuses are only partly known when an account's roster failed
  const deg = !!(DATA.degraded && DATA.degraded.length);
  /* With a target, the hero says how far off it is. Without one it still leads with
     CPT — the number people came for — and simply does not judge it. */
  const heroSub = T===null
    ? (k===null ? 'no target set' : `no target set · ${num(tr)} trials`)
    : `target ${rs(T)} · ${k===null?'':(k<=T?'under':'over')} by ${k===null?'—':rs(Math.abs(k-T))}`;
  /* Spend leads instead when the brand has no trial feed: promoting a CPT tile that
     could only ever read "—" would make a missing Branch key look like zero trials. */
  document.getElementById('kpis').innerHTML =
   (trials ? `
   <div class="kpi hero"><div class="k">Current CPT</div>
     <div class="v ${cls(k)}">${k===null?'—':rs(k)}</div>
     <div class="s">${heroSub}</div></div>` : '') + `
   <div class="kpi${trials ? '' : ' hero'}"><div class="k">Spend</div><div class="v">${rs(sp)}</div>
     <div class="s">${days>1 ? `${rs(sp/days)}/day avg over ${days} days`
       : !DATA.budgets_known ? 'budget unavailable — partial data'
             : `${rs(c.budget)}/day budget · ${pace.toFixed(0)}% used${budgetAge()}`}</div></div>` +
   (trials ? `
   <div class="kpi"><div class="k">Trials</div><div class="v">${num(tr)}</div>
     <div class="s">${DATA.event_note[EV]||EV} · Branch ${num(DATA.branch_totals[EV])} total</div></div>
   <div class="kpi"><div class="k">Attribution</div><div class="v">${cov.toFixed(1)}%</div>
     <div class="s">${num(DATA.unattributed[EV])} trials not matched to an ad</div></div>`
   : `
   <div class="kpi"><div class="k">Budget/day</div><div class="v">${rs(c.budget)}</div>
     <div class="s">across ${num(DATA.accounts.length)} ad accounts${budgetAge()}</div></div>`) + `
   <div class="kpi"><div class="k">${deg ? 'Ad sets' : 'Live'}</div>
     <div class="v">${num(c.active_adsets)}</div>
     <div class="s">${deg ? `with spend · ${num(c.active_ads)} ads (status unknown)`
                          : `active ad sets · ${num(c.active_ads)} ads`}</div></div>` +
   (cpOn() ? cpKpis(c, sp) : '');
}

/* Spend is re-read every refresh; the budget beside it is not — it comes off the cached
   ad set listing. Two numbers in one line, one a minute old and one possibly half an hour
   old, must not look equally live. Silent under two minutes, because saying "as of now"
   on every render is noise. */
function budgetAge(){
  const a = DATA.budget_age_sec;
  if(a === null || a === undefined || a < 120) return '';
  return ` · budget as of <span class="${a > 2400 ? 'warn' : ''}">${DATA.budget_as_of}</span>`;
}

/* Classplus reads the product DB rather than the attribution SDK, so it answers a
   different question than Branch does: of the people who signed up through this ad,
   how many put a mandate in place. Cost/mandate is the same rupees-per-trial unit as
   CPT and is coloured against the same target, deliberately — it is the second opinion
   on the number every decision here is made on. */
function cpKpis(c, sp){
  const p = DATA.classplus, m = c.cp_mandates, su = c.cp_signups;
  return `
   <div class="kpi"><div class="k">Cost / mandate</div>
     <div class="v ${cls(cpt(sp,m))}">${cptTxt(sp,m)}</div>
     <div class="s">${num(m)} mandates · Branch says ${num(c[EV])} trials</div></div>
   <div class="kpi"><div class="k">Signups</div><div class="v">${num(su)}</div>
     <div class="s">${cptTxt(sp,su)} each · ${pct(m,su)} take a mandate</div></div>
   <div class="kpi"><div class="k">Day-0</div><div class="v">${pct(c.cp_d0a,m)}</div>
     <div class="s">active on day 0 · ${pct(c.cp_d0c,m)} cancelled ·
       Classplus ${p.age_min===null?'':p.age_min+' min old'}</div></div>`;
}

/* ---------- table specs ---------- */
const COLS = {
  accounts: [
    {k:'name', t:'Ad account', kind:'name'},
    {k:'spend', t:'Spend', kind:'rs'},
    {k:'budget', t:'Budget/day', kind:'rs'},
    {k:'trials', t:'Trials', kind:'num'},
    {k:'cpt', t:'CPT', kind:'cpt'},
    {k:'active_adsets', t:'Ad sets', kind:'num'},
    {k:'active_ads', t:'Ads', kind:'num'}],
  campaigns: [
    {k:'name', t:'Campaign', kind:'name'},
    {k:'account', t:'Account', kind:'sub'},
    {k:'spend', t:'Spend', kind:'rs'},
    {k:'budget', t:'Budget/day', kind:'rs'},
    {k:'trials', t:'Trials', kind:'num'},
    {k:'cpt', t:'CPT', kind:'cpt'},
    {k:'active_adsets', t:'Ad sets', kind:'num'},
    {k:'active_ads', t:'Ads', kind:'num'}],
  adsets: [
    {k:'name', t:'Ad set', kind:'name'},
    {k:'campaign', t:'Campaign', kind:'sub'},
    {k:'spend', t:'Spend', kind:'rs'},
    {k:'budget', t:'Budget', kind:'rs'},
    {k:'trials', t:'Trials', kind:'num'},
    {k:'cpt', t:'CPT', kind:'cpt'},
    {k:'active_ads', t:'Ads', kind:'num'}],
  ads: [
    {k:'name', t:'Ad', kind:'name'},
    {k:'adset', t:'Ad set', kind:'sub'},
    {k:'spend', t:'Spend', kind:'rs'},
    {k:'trials', t:'Trials', kind:'num'},
    {k:'cpt', t:'CPT', kind:'cpt'}],
};

/* Appended to whichever tab is showing, so signups and mandates sit on the same row as
   the spend that bought them at every level. */
const CP_COLS = [
  {k:'cp_signups', t:'Signups', kind:'num'},
  {k:'cps', t:'Cost/signup', kind:'rs'},
  {k:'cp_mandates', t:'Mandates', kind:'num'},
  {k:'cpm', t:'Cost/mandate', kind:'cpm'},
  {k:'d0a', t:'D0 active', kind:'pct'},
  {k:'d0c', t:'D0 cancel', kind:'pct'},
];

/* The trial and CPT columns exist only for a brand that has a Branch feed. Dropping
   them beats rendering "0" and "—" down the whole table: a zero is a claim that
   nothing happened, which is not what a missing key means. */
function colsFor(tab){
  const base = hasTrials() ? COLS[tab]
                           : COLS[tab].filter(c => c.k!=='trials' && c.k!=='cpt');
  return cpOn() ? base.concat(CP_COLS) : base;
}

function rows(){
  if(TAB==='combined') return [];
  let r = DATA[TAB].map(o => Object.assign({}, o, {
      trials: o[EV], cpt: cpt(o.spend, o[EV]),
      cps: cpt(o.spend, o.cp_signups), cpm: cpt(o.spend, o.cp_mandates),
      d0a: o.cp_mandates > 0 ? 100*o.cp_d0a/o.cp_mandates : null,
      d0c: o.cp_mandates > 0 ? 100*o.cp_d0c/o.cp_mandates : null}));
  const q = document.getElementById('q').value.trim().toLowerCase();
  if(q) r = r.filter(o => (o.name||'').toLowerCase().includes(q) ||
                          (o.campaign||'').toLowerCase().includes(q) ||
                          (o.adset||'').toLowerCase().includes(q));
  if(document.getElementById('activeOnly').checked && (TAB==='adsets'||TAB==='ads'))
    r = r.filter(o => o.active);
  if(document.getElementById('activeOnly').checked && TAB==='campaigns')
    r = r.filter(o => o.status==='ACTIVE');
  if(document.getElementById('spentOnly').checked) r = r.filter(o => o.spend > 0);
  const k = SORT.key, d = SORT.dir;
  r.sort((a,b) => {
    let x=a[k], y=b[k];
    if(k==='cpt'){                      // no-trial rows sort as worst
      x = x===null ? (a.spend>0 ? Infinity : -1) : x;
      y = y===null ? (b.spend>0 ? Infinity : -1) : y;
    }
    if(typeof x==='string') return d * x.localeCompare(y);
    return d * ((x??0) - (y??0));
  });
  return r;
}

function cell(o, c){
  if(c.kind==='name'){
    const live = o.active || o.status==='ACTIVE';
    return `<td class="name" title="${(o.name||'').replace(/"/g,'&quot;')}">${o.name||'—'}` +
      (TAB!=='accounts' && !live ? `<span class="pill">paused</span>`:'') +
      (o.shared_name ? `<span class="pill">shared name</span>`:'') + `</td>`;
  }
  if(c.kind==='sub') return `<td class="sub" title="${o[c.k]||''}">${o[c.k]||'—'}</td>`;
  if(c.kind==='rs')  return `<td>${o[c.k] ? rs(o[c.k]) : '—'}</td>`;
  if(c.kind==='num') return `<td>${o[c.k] ? num(o[c.k]) : '<span class="dimtxt">0</span>'}</td>`;
  if(c.kind==='cpt') return `<td class="${cls(o.cpt)}">${cptTxt(o.spend, o.trials)}</td>`;
  if(c.kind==='cpm') return `<td class="${cls(o.cpm)}">${cptTxt(o.spend, o.cp_mandates)}</td>`;
  if(c.kind==='pct') return `<td>${o[c.k]===null ? '<span class="dimtxt">—</span>'
                                                 : o[c.k].toFixed(0)+'%'}</td>`;
  return `<td>${o[c.k]??'—'}</td>`;
}

function renderTable(){
  const tbl = document.getElementById('tbl');
  if(TAB==='combined'){
    document.getElementById('ctl').style.display='none';
    const on = cpOn();
    const tr_ = hasTrials();
    tbl.querySelector('thead').innerHTML =
      `<tr><th>Level</th><th>Spend</th>` +
      (tr_ ? `<th>Trials</th><th>CPT</th>` : `<th>Budget/day</th>`) +
      (on ? `<th>Signups</th><th>Mandates</th><th>Cost/mandate</th>` : '') +
      `<th>Share of spend</th>` + (tr_ ? `<th>Share of trials</th>` : '') + `</tr>`;
    const c = DATA.combined;
    const mk = (label, o, indent) => { const sp = o.spend, tr = o[EV];
      return `<tr><td class="name" style="padding-left:${12+indent*20}px">${label}</td>
      <td>${rs(sp)}</td>` +
      (tr_ ? `<td>${num(tr)}</td><td class="${cls(cpt(sp,tr))}">${cptTxt(sp,tr)}</td>`
           : `<td>${rs(o.budget||0)}</td>`) +
      (on ? `<td>${num(o.cp_signups)}</td><td>${num(o.cp_mandates)}</td>
             <td class="${cls(cpt(sp,o.cp_mandates))}">${cptTxt(sp,o.cp_mandates)}</td>` : '') +
      `<td>${c.spend?(100*sp/c.spend).toFixed(1):0}%</td>` +
      (tr_ ? `<td>${c[EV]?(100*tr/c[EV]).toFixed(1):0}%</td>` : '') + `</tr>`; };
    let h = '';
    for(const a of DATA.accounts){
      h += mk(`<b>${a.name}</b>`, a, 0);
      for(const cm of DATA.campaigns.filter(x=>x.account_id===a.id && (x.spend>0||x.status==='ACTIVE')))
        h += mk(cm.name, cm, 1);
    }
    tbl.querySelector('tbody').innerHTML = h;
    const nAcc = DATA.accounts.length;
    tbl.querySelector('tfoot').innerHTML =
      `<tr><td>COMBINED — all ${nAcc} ad account${nAcc===1?'':'s'}</td><td>${rs(c.spend)}</td>` +
      (tr_ ? `<td>${num(c[EV])}</td>
              <td class="${cls(cpt(c.spend,c[EV]))}">${cptTxt(c.spend,c[EV])}</td>`
           : `<td>${rs(c.budget||0)}</td>`) +
      (on ? `<td>${num(c.cp_signups)}</td><td>${num(c.cp_mandates)}</td>
             <td class="${cls(cpt(c.spend,c.cp_mandates))}">${cptTxt(c.spend,c.cp_mandates)}</td>` : '') +
      `<td>100%</td>` + (tr_ ? `<td>100%</td>` : '') + `</tr>`;
    document.getElementById('rowcount').textContent='';
    return;
  }
  document.getElementById('ctl').style.display='flex';
  const cols = colsFor(TAB), r = rows();
  tbl.querySelector('thead').innerHTML = '<tr>' + cols.map(c => {
    const cls = [c.kind==='name'||c.kind==='sub' ? 'l' : '',
                 c.kind==='sub' ? 'grow' : '',
                 SORT.key===c.k ? 'sorted' : ''].filter(Boolean).join(' ');
    return `<th data-k="${c.k}" class="${cls}">${c.t}${
      SORT.key===c.k?(SORT.dir<0?' ↓':' ↑'):''}</th>`; }).join('') + '</tr>';
  tbl.querySelector('thead').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    SORT = {key:k, dir: SORT.key===k ? -SORT.dir : (k==='name'?1:-1)};
    renderTable();
  });
  tbl.querySelector('tbody').innerHTML = r.map(o =>
    '<tr>' + cols.map(c => cell(o,c)).join('') + '</tr>').join('');
  // Footer totals are recomputed from the visible rows, never averaged: a rate is
  // derived from the summed numerator and denominator so filtering the table cannot
  // produce a cost-per that no row actually implies.
  const sum = k => r.reduce((s,o)=>s+(o[k]||0),0);
  const sp = sum('spend'), tr = sum('trials'),
        su = sum('cp_signups'), md = sum('cp_mandates');
  tbl.querySelector('tfoot').innerHTML = '<tr>' + cols.map(c => {
    if(c.kind==='name') return `<td>${r.length} rows shown</td>`;
    if(c.k==='spend') return `<td>${rs(sp)}</td>`;
    if(c.k==='trials') return `<td>${num(tr)}</td>`;
    if(c.kind==='cpt') return `<td class="${cls(cpt(sp,tr))}">${cptTxt(sp,tr)}</td>`;
    if(c.k==='cps') return `<td>${cptTxt(sp,su)}</td>`;
    if(c.kind==='cpm') return `<td class="${cls(cpt(sp,md))}">${cptTxt(sp,md)}</td>`;
    if(c.k==='d0a') return `<td>${pct(sum('cp_d0a'),md)}</td>`;
    if(c.k==='d0c') return `<td>${pct(sum('cp_d0c'),md)}</td>`;
    if(c.kind==='rs'||c.kind==='num')
      return `<td>${c.kind==='rs'?rs(sum(c.k)):num(sum(c.k))}</td>`;
    return '<td></td>';
  }).join('') + '</tr>';
  document.getElementById('rowcount').textContent =
    `${r.length} of ${DATA[TAB].length}`;
}

function render(){
  T = DATA.cpt_target;
  document.getElementById('bname').textContent = DATA.brand_label;
  document.title = `${DATA.brand_label} Performance`;
  document.getElementById('win').textContent =
    DATA.since===DATA.until ? DATA.since : `${DATA.since} → ${DATA.until}`;
  stampNow();
  for(const t of ['accounts','campaigns','adsets','ads'])
    document.getElementById('n-'+t).textContent = DATA[t].length;
  document.getElementById('cpWrap').style.display =
    (DATA.classplus && DATA.classplus.available) ? 'inline-flex' : 'none';
  renderLimits(); kpis(); renderTable();
  const accts = `Covers ${DATA.accounts.length === 1 ? 'one ad account' :
    `all ${DATA.accounts.length} ${DATA.brand_label} ad accounts`}.`;
  const dup = DATA.duplicate_ad_names ? `${DATA.duplicate_ad_names} ad name(s) are reused by
     more than one ad (marked <i>shared name</i>); Branch cannot tell those ads apart, so their
     trials are split by spend share — the rollups stay exact, the individual CPTs are an even
     assumption. ` : '';
  const lag = `Today's numbers are still landing — Meta spend lags a few minutes${
     hasTrials() ? ' and Branch trials keep arriving through the day, so intraday CPT reads high early and settles down' : ''}.`;
  document.getElementById('note').innerHTML = cpNote() + (hasTrials()
    ? `CPT = Meta spend ÷ Branch trials, joined at <b>ad-name</b> level and rolled up
       (Branch does not expose campaign or account as attribution dimensions).
       ${accts} ${DATA.unattributed[EV]>0
         ? `${num(DATA.unattributed[EV])} Branch trial(s) matched no ad in any of them — organic,
            other channels, or deleted ads — so they sit outside every row above.`:''}
       ${dup}${lag}`
    /* No Branch app for this brand: say so plainly and name what is missing, rather
       than leaving someone to wonder why there is no CPT on a page called CPT. */
    : `<b>Spend, budgets and statuses only.</b> ${DATA.brand_label} has no Branch app
       configured here, so there are no trial counts and therefore no CPT. Everything
       above comes straight from Meta. Adding the Branch key and naming the two events
       fills the trial and CPT columns in with no other change. ${accts} ${dup}${lag}`);
}

/* Signups and mandates come from a different system asking a different question, and
   the gap between "mandates" and "trials" is the first thing anyone will ask about.
   Say what each one counts here rather than letting the two columns look like a
   discrepancy. */
function cpNote(){
  const p = DATA.classplus;
  // Absent is the normal case on any window the query does not cover — a quiet line,
  // not a warning banner, since nothing is broken.
  if(!p) return '';
  if(!p.available) return p.note ? `<span class="dimtxt">${p.note}</span><br><br>` : '';
  if(!cpOn()) return '';                 // columns switched off — the checkbox says why
  const u = p.unmatched;
  return `<b>Signups &amp; mandates</b> come from the Classplus DB (query
     ${p.window[0]}${p.window[1]!==p.window[0]?' → '+p.window[1]:''}, read
     ${p.retrieved_at}), joined on the same <b>ad name</b> Branch uses.
     A mandate is counted against the ad the user <i>signed up</i> through, so it is a
     signup-cohort figure: someone who signed up yesterday and started a trial today
     counts for Branch but not here. That, not a data problem, is why
     ${num(DATA.combined.cp_mandates)} mandates and ${num(DATA.combined[EV])} Branch
     trials differ slightly.
     ${u.cp_signups>0 ? `${num(u.cp_signups)} signups and ${num(u.cp_mandates)} mandates
       carry no matching live ad name (organic, or an ad since deleted) and sit outside
       every row.`:''}<br><br>`;
}

/* ---------- wiring ---------- */
const selEl = document.getElementById('range'),
      cWrap = document.getElementById('customWrap'),
      cSince = document.getElementById('cSince'), cUntil = document.getElementById('cUntil');
cSince.max = cUntil.max = istToday();     // no pulling a window that has not happened

selEl.onchange = () => {
  const custom = selEl.value === 'custom';
  cWrap.classList.toggle('on', custom);
  if(custom){
    // Seed with the last 7 days rather than blanks, so Apply is one click from useful.
    if(!cUntil.value) cUntil.value = istToday();
    if(!cSince.value) cSince.value =
      new Date(Date.now() + 330*60000 - 6*864e5).toISOString().slice(0,10);
    cSince.focus();
    return;                               // wait for Apply — do not pull a half-set range
  }
  CUSTOM = null; RANGE = selEl.value; load(false);
};

document.getElementById('cGo').onclick = () => {
  const a = cSince.value, b = cUntil.value;
  const err = document.getElementById('err');
  if(!a || !b) return;
  if(a > b){ err.innerHTML = `<div class="err">Start date is after the end date.</div>`; return; }
  // Branch is fetched in 7-day chunks and Meta insights are re-pulled per account, so a
  // long window is many round trips. Refuse it outright rather than hanging for minutes.
  const span = Math.round((new Date(b) - new Date(a))/864e5) + 1;
  if(span > MAX_SPAN){
    err.innerHTML = `<div class="err"><b>${span} days is too wide.</b> Branch is fetched in
      7-day chunks, so this would be ${Math.ceil(span/7)*2} Branch calls plus a full Meta
      pull per account. Keep it to ${MAX_SPAN} days or fewer.</div>`;
    return;
  }
  err.innerHTML = ''; CUSTOM = {since:a, until:b}; load(false);
};
document.getElementById('tabs').onclick = e => {
  if(!e.target.dataset.t) return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on'); TAB = e.target.dataset.t;
  SORT = {key:'spend', dir:-1}; renderTable();
};
/* Refresh is a deliberate act, so it forces everything the automatic pull will not:
   the server payload cache AND Meta's roster, which is where budgets and paused/active
   status come from. Without the second, pressing Refresh could never move a budget
   figure for up to 30 minutes, which is the opposite of what the button promises. It
   blocks, and the veil makes that legible. */
document.getElementById('refresh').onclick = () => load(true, false, true);
/* Switching brand replaces every figure on the page, so it is a foreground load with
   the veil up — not a silent swap that would briefly show one brand's spend under
   another's name. The tab is marked active immediately so the click feels answered. */
document.getElementById('brandsw').onclick = e => {
  const b = e.target.dataset && e.target.dataset.b;
  if(!b || b === BRAND) return;
  BRAND = b;
  [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x.dataset.b === b));
  document.getElementById('bname').textContent = (BRANDS[b]||{}).label || b;
  DATA = null;                       // never render one brand's rows under another's name
  TAB = 'combined';
  [...document.getElementById('tabs').children].forEach(
    x => x.classList.toggle('on', x.dataset.t === 'combined'));
  SORT = {key:'spend', dir:-1};
  history.replaceState(null, '', `?brand=${b}`);
  load(true, false, false);
};
document.getElementById('q').oninput = renderTable;
document.getElementById('activeOnly').onchange = renderTable;
document.getElementById('spentOnly').onchange = renderTable;
document.getElementById('cpCols').onchange = render;   // also swaps the KPI row
/* Refresh cadence. The instance sleeps after ~15 min idle on the free plan, so a bare
   30-minute refresh would always be paying a cold wake. While a tab is open we ping the
   cheap /healthz every 10 min to keep it warm — that costs nothing when nobody is
   looking, because the pings stop with the tab. */
const REFRESH_MS = 30*60*1000, KEEPALIVE_MS = 10*60*1000;
let keepalive = null;
function setAuto(on){
  clearInterval(timer); clearInterval(keepalive); timer = keepalive = null;
  if(!on) return;
  /* force, not hard: this tick bypasses the 90s payload cache and lets each roster
     listing expire on its own TTL, which is set below this interval so it always has.
     Forcing the roster here instead would multiply Meta listing calls by the number of
     open tabs — the one cost the roster cache exists to prevent. */
  timer = setInterval(()=>load(true, true), REFRESH_MS);
  keepalive = setInterval(()=>fetch('/healthz').catch(()=>{}), KEEPALIVE_MS);
}
/* Always on, with no way to switch it off: the whole value of this page is that the CPT
   on screen is current. A dashboard someone left on a stale window and then acted on is
   the failure this exists to prevent. `silent` so it never veils the page mid-read. */
setAuto(true);

// keep the "x min ago" honest between refreshes
ticker = setInterval(stampNow, 15000);

/* Coming back to the tab is exactly when stale numbers do damage — you glance at a CPT
   and act on it. Anything older than two minutes gets re-pulled on focus. */
const refocus = () => { if(!BUSY && ageSecs() > 120) load(false, true); };
document.addEventListener('visibilitychange',
  () => { if(document.visibilityState === 'visible') refocus(); });
window.addEventListener('focus', refocus);

load(false);   // veiled: the cold pull is exactly what the veil is for
</script>
