<!doctype html>
<meta charset="utf-8">
<title>Access · Ads Performance</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/postly_icon_logo.svg">
<style>
/* Deliberately the dashboard's own palette and spacing: this is the same product, and a
   settings page that looks like a different app makes people wonder whose it is. */
:root{--ink:#1A1C2E;--muted:#787E91;--faint:#A2A7B6;--line:#E6E3DA;--line2:#F0EDE4;
  --white:#fff;--bg:#FDFCF7;--panel:#F6F4EC;--accent:#20A75D;--accent-dk:#127A42;
  --accent-lt:#EAF7F0;--bad:#B3261E;--badlt:#FCEEEC;--warn:#8A6100;--warnlt:#FBF3E2}
*{box-sizing:border-box}
body{font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);margin:0;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 80px}

header{border-bottom:1px solid var(--line);background:var(--white);margin-bottom:26px}
.hin{max-width:1000px;margin:0 auto;padding:15px 20px;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap}
.hin h1{font-size:16.5px;margin:0;font-weight:700;letter-spacing:-.01em}
.hin h1 em{font-style:normal;color:var(--faint);font-weight:500;margin-left:7px}
.hin .sp{margin-left:auto}
.lnk{color:var(--muted);text-decoration:none;font-size:13px;font-weight:550}
.lnk:hover{color:var(--accent-dk)}
.lnk+.lnk{margin-left:14px}

.lead{color:var(--muted);margin:0 0 20px;max-width:62ch}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:0 1px 2px rgba(26,28,46,.03)}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:10px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--faint);font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line);
  background:var(--panel)}
td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.new td{background:var(--accent-lt)}
.em{font-weight:600;word-break:break-all}
/* The summary answers "who has access" before the table is read at all, and the filter
   is what keeps this page usable at forty people rather than eleven. */
.bar{display:flex;align-items:center;gap:14px;margin:0 0 12px;flex-wrap:wrap}
.tally{font-size:13px;color:var(--muted)}
.tally .going{color:var(--bad);font-weight:600}
#q{margin-left:auto;min-width:230px;font:inherit;font-size:13.5px;padding:7px 11px;
  border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--ink)}
#q:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-lt)}

/* A person, not a row: the same initials mark the dashboard header uses, so someone
   looks like the same someone in both places. */
.who{display:flex;align-items:center;gap:10px}
.idy{min-width:0;flex:1}
.ini{flex:none;width:30px;height:30px;border-radius:99px;display:grid;place-items:center;
  background:var(--panel);color:var(--muted);font-size:11px;font-weight:700;
  letter-spacing:.02em}
.ini.adm{background:var(--accent-lt);color:var(--accent-dk)}

/* Marked for removal, not gone. Struck through and reversible until Save. */
tr.drop td{background:var(--badlt)}
tr.drop .nameinp,tr.drop .sub{text-decoration:line-through;opacity:.65}
tr.drop .ini{background:var(--badlt);color:var(--bad)}
.btn.undo{padding:4px 11px;font-size:12.5px;color:var(--bad);border-color:#EBC7C2}
.btn.rm{padding:4px 11px;font-size:12.5px}
/* Reads as the name it is until you go near it, then admits it is a field. A row of
   boxed inputs turns a directory into a form. */
.nameinp{font:inherit;font-weight:600;font-size:14.5px;color:var(--ink);width:100%;
  max-width:230px;background:none;border:1px solid transparent;border-radius:7px;
  padding:3px 7px;margin:-3px 0 0 -7px}
.nameinp::placeholder{color:var(--faint);font-weight:500;font-style:italic}
.nameinp:hover{border-color:var(--line)}
.nameinp:focus{outline:0;border-color:var(--accent);background:var(--white);
  box-shadow:0 0 0 3px var(--accent-lt)}
.sub{font-size:11.5px;color:var(--faint);margin-top:1px}

/* Brand access as toggles, not a multi-select: three brands is a row of buttons, and a
   <select multiple> is the control everyone mis-clicks. */
.brands{display:flex;gap:6px;flex-wrap:wrap}
.brands label{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;
  font-weight:550;border:1px solid var(--line);border-radius:99px;padding:4px 11px;
  background:var(--white);cursor:pointer;user-select:none;transition:.12s}
.brands label:hover{border-color:var(--faint)}
.brands label.on{background:var(--accent-lt);border-color:#BFE6D0;color:var(--accent-dk)}
.brands input{position:absolute;opacity:0;width:0;height:0}
.brands.off label{opacity:.5;cursor:default;background:var(--panel)}

select,input[type=email]{font:inherit;font-size:13.5px;padding:7px 10px;
  border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--ink)}
select{cursor:pointer;padding-right:26px}
input[type=email]{min-width:250px}
input:focus,select:focus{outline:0;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-lt)}

.btn{font:inherit;font-size:13.5px;font-weight:600;padding:8px 15px;border-radius:9px;
  cursor:pointer;border:1px solid var(--line);background:var(--white);color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.go:hover:not(:disabled){background:var(--accent-dk);border-color:var(--accent-dk)}
.btn:disabled{opacity:.4;cursor:default}
.btn.rm{color:var(--muted)}
.btn.rm:hover{color:var(--bad);background:var(--badlt);border-color:#EBC7C2}

.scrim{position:fixed;inset:0;background:rgba(26,28,46,.34);z-index:40}
.modal{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(430px,calc(100vw - 32px));background:var(--white);border:1px solid var(--line);
  border-radius:14px;padding:22px;box-shadow:0 24px 60px rgba(26,28,46,.22)}
.modal h2{font-size:16.5px;margin:0 0 16px}
.fld{display:block;margin:0 0 14px}
.fld>span{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
  color:var(--faint);font-weight:700;margin:0 0 5px}
.fld input,.fld select{width:100%}
.hint{font-size:12px;color:var(--faint);margin-top:6px}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal .msg{margin:12px 0 0;flex:none}

.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;
  background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.tag.fixed{background:var(--warnlt);color:var(--warn);border-color:#EBD9AE}

/* The save bar follows you down a long list: a Save button you have to scroll back up to
   is a Save button people forget to press. */
.savebar{position:sticky;bottom:0;margin-top:18px;padding:14px 0;
  background:linear-gradient(to top,var(--bg) 68%,rgba(253,252,247,0));
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.msg{padding:10px 14px;border-radius:10px;font-size:13.5px;display:none;flex:1 1 260px}
.msg.err{background:var(--badlt);color:var(--bad);display:block}
.msg.ok{background:var(--accent-lt);color:var(--accent-dk);display:block}
.msg.info{background:var(--panel);color:var(--muted);display:block}

.legend{margin:26px 0 0;display:grid;gap:10px;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.leg{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.leg b{display:block;font-size:13px;margin-bottom:3px}
.leg span{font-size:12.5px;color:var(--muted);line-height:1.5}
.foot{color:var(--faint);font-size:12.5px;margin:20px 0 0;line-height:1.6}
.muted{color:var(--faint)}
@media(max-width:640px){
  th:nth-child(4),td:nth-child(4){display:none}
  input[type=email]{min-width:100%}
}
</style>

<header><div class="hin">
  <h1>Access <em>Ads Performance</em></h1>
  <span class="sp"></span>
  <a class="lnk" href="/">Back to the dashboard</a>
  <a class="lnk" href="/auth/logout">Sign out</a>
</div></header>

<div class="wrap">
  <div class="bar">
    <div class="tally" id="tally"></div>
    <input type="search" id="q" placeholder="Filter by name, email or brand…"
           autocomplete="off" spellcheck="false">
    <button class="btn go" id="openAdd">Add user</button>
  </div>

  <div class="card">
    <table>
      <thead><tr>
        <th style="width:31%">Person</th><th style="width:29%">Brands</th>
        <th style="width:19%">Role</th><th style="width:15%">Added</th><th></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>

  <!-- A dialog, because five fields in a table footer is a form pretending not to be
       one: the labels go missing, the brand toggles sit next to a role select with
       nothing saying which belongs to what, and it grows every time a field is added. -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="modal" id="addModal" role="dialog" aria-modal="true"
       aria-labelledby="addTitle" hidden>
    <h2 id="addTitle">Add user</h2>
    <label class="fld"><span>Name</span>
      <input type="text" id="newName" placeholder="Krishna Prasun" autocomplete="off"></label>
    <label class="fld"><span>Email</span>
      <input type="email" id="newEmail" placeholder="krishna.prasun@classplus.co"
             autocomplete="off" spellcheck="false"></label>
    <label class="fld"><span>Role</span>
      <select id="newRole">
        {% for r in roles %}<option value="{{ r.key }}"{% if r.key == 'viewer' %} selected{% endif %}>{{ r.label }}</option>{% endfor %}
      </select></label>
    <div class="fld"><span>Brands</span>
      <div class="brands" id="newBrands"></div>
      <div class="hint" id="brandHint">An admin sees every brand.</div></div>
    <div class="mrow">
      <button class="btn" id="cancelAdd">Cancel</button>
      <button class="btn go" id="add">Add user</button>
    </div>
    <div class="msg" id="modalMsg"></div>
  </div>

  <div class="savebar">
    <button class="btn go" id="save" disabled>Save changes</button>
    <span class="muted" id="dirty"></span>
    <div class="msg" id="msg"></div>
  </div>

  <div class="legend">
    <div class="leg"><b>Admin</b><span>Every brand, plus Manage access and Refresh.</span></div>
    <div class="leg"><b>Member</b><span>Their brands, and CSV export.</span></div>
    <div class="leg"><b>View only</b><span>Their brands. Nothing else.</span></div>
  </div>

  <p class="foot">Changes take effect within a minute.</p>
</div>

<script>
const BRANDS = {{ brands|tojson }}, ROLES = {{ roles|tojson }}, ME = {{ me|tojson }};
let USERS = [], LOADED = false;

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const roleLabel = k => (ROLES.find(r => r.key === k) || {label: k}).label;

function msg(text, kind){
  const m = document.getElementById('msg');
  m.className = 'msg' + (kind ? ' ' + kind : '');
  m.textContent = text || '';
}
function mark(on){
  document.getElementById('save').disabled = !on;
  document.getElementById('dirty').textContent = on ? 'unsaved changes' : '';
}

/* An admin sees every brand by definition, so their ticks are shown but locked --
   greyed rather than absent, because an empty cell reads as "no brands". */
function brandCell(u, i){
  const all = u.role === 'super';
  return `<div class="brands ${all || u.bootstrap ? 'off' : ''}">` + BRANDS.map(b => {
    const on = all || u.brands.includes(b.key);
    return `<label class="${on ? 'on' : ''}"><input type="checkbox" data-i="${i}"
      data-b="${b.key}" ${on ? 'checked' : ''}
      ${all || u.bootstrap ? 'disabled' : ''}>${esc(b.label)}</label>`;
  }).join('') + '</div>';
}

function roleCell(u, i){
  if(u.bootstrap) return `<span class="tag fixed" title="Set in the environment">${
    esc(roleLabel(u.role))} · fixed</span>`;
  return `<select data-role="${i}">` + ROLES.map(r =>
    `<option value="${r.key}"${r.key === u.role ? ' selected' : ''}>${esc(r.label)}</option>`
  ).join('') + '</select>';
}

function when(u){
  if(!u.at) return '<span class="muted">—</span>';
  const d = new Date(u.at * 1000);
  /* The local part only: "by krishna.prasun" says who without wrapping the column onto
     three lines, and the full address is on the tooltip for the one time it matters. */
  const by = (u.by || '').split('@')[0];
  return `${d.toLocaleDateString(undefined, {day:'numeric', month:'short'})}` +
    (by ? `<div class="sub" title="${esc(u.by)}">by ${esc(by)}</div>` : '');
}

/* Initials from the name where there is one, from the address where there is not — the
   same mark the dashboard header uses, so a person looks like the same person in both
   places. */
function initials(u){
  const src = (u.name || u.email.split('@')[0]).replace(/[._-]+/g, ' ').trim();
  const parts = src.split(/\s+/).filter(Boolean);
  return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length-1][0] : ''))
         .toUpperCase();
}

function tally(){
  const n = USERS.length;
  const by = r => USERS.filter(u => u.role === r).length;
  const bits = [`${n} ${n === 1 ? 'person' : 'people'}`];
  for(const r of ROLES){ const c = by(r.key); if(c) bits.push(`${c} ${r.label.toLowerCase()}`); }
  const gone = USERS.filter(u => u.drop).length;
  document.getElementById('tally').innerHTML = bits.join(' · ')
    + (gone ? ` · <span class="going">${gone} to remove</span>` : '');
}

function match(u){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  if(!q) return true;
  return (u.name || '').toLowerCase().includes(q)
      || u.email.toLowerCase().includes(q)
      || u.brands.some(b => ((BRANDS.find(x => x.key === b) || {}).label || b)
                              .toLowerCase().includes(q));
}

function draw(){
  const shown = USERS.map((u, i) => [u, i]).filter(([u]) => match(u));
  document.getElementById('rows').innerHTML = shown.length ? shown.map(([u, i]) => `
    <tr class="${u.drop ? 'drop' : u.at ? '' : 'new'}">
      <td><div class="who">
        <span class="ini ${u.role === 'super' ? 'adm' : ''}">${esc(initials(u))}</span>
        <div class="idy">
          <input class="nameinp" data-name="${i}" value="${esc(u.name || '')}"
                 placeholder="Add name" aria-label="Name for ${esc(u.email)}">
          <div class="sub">${esc(u.email)}${
            u.email === ME ? ' · <b>you</b>' : ''}</div>
        </div></div></td>
      <td>${brandCell(u, i)}</td>
      <td>${roleCell(u, i)}</td>
      <td>${when(u)}</td>
      <td style="text-align:right">${
        u.bootstrap ? ''
        : u.drop ? `<button class="btn undo" data-undo="${i}">Undo</button>`
        : `<button class="btn rm" data-rm="${i}"
             title="Remove ${esc(u.email)}">Remove</button>`}</td>
    </tr>`).join('')
    : `<tr><td colspan="5" class="muted">${USERS.length ? 'Nobody matches that.'
                                                       : 'Nobody yet.'}</td></tr>`;
  tally();
}

const rows = document.getElementById('rows');
/* The name is editable where it is shown. Everything else in this table already is,
   and the three people who were here before the field existed have to get theirs
   somehow — the Add dialog only ever sees new people. */
rows.addEventListener('input', e => {
  const inp = e.target.closest('input[data-name]');
  if(!inp) return;
  USERS[+inp.dataset.name].name = inp.value.trim();
  mark(true);
});
rows.addEventListener('change', e => {
  const sel = e.target.closest('select[data-role]');
  if(sel){
    const u = USERS[+sel.dataset.role];
    u.role = sel.value;
    if(u.role === 'super') u.brands = BRANDS.map(b => b.key);
    draw(); mark(true); return;
  }
  const cb = e.target.closest('input[type=checkbox]');
  if(!cb) return;
  const u = USERS[+cb.dataset.i], set = new Set(u.brands);
  cb.checked ? set.add(cb.dataset.b) : set.delete(cb.dataset.b);
  u.brands = BRANDS.map(b => b.key).filter(k => set.has(k));
  cb.parentElement.classList.toggle('on', cb.checked);
  mark(true);
});
/* Removal marks the row rather than deleting it, until Save. A row that vanishes on a
   click gives you nothing to check before committing and no way back if it was the wrong
   one — and this list is the difference between a colleague having access and not. */
rows.addEventListener('click', e => {
  const rm = e.target.closest('button[data-rm]');
  if(rm){ USERS[+rm.dataset.rm].drop = true; draw(); mark(true); return; }
  const un = e.target.closest('button[data-undo]');
  if(un){ delete USERS[+un.dataset.undo].drop; draw(); mark(true); }
});
document.getElementById('q').addEventListener('input', draw);

const nb = document.getElementById('newBrands');
nb.innerHTML = BRANDS.map(b =>
  `<label><input type="checkbox" data-new="${b.key}">${esc(b.label)}</label>`).join('');
nb.addEventListener('change', e => {
  const cb = e.target.closest('input');
  if(cb) cb.parentElement.classList.toggle('on', cb.checked);
});
function newRoleChanged(){
  /* An admin sees every brand by definition, so the toggles would be a lie you could
     click. Locked, with the reason under them. */
  const sup = document.getElementById('newRole').value === 'super';
  nb.classList.toggle('off', sup);
  nb.querySelectorAll('input').forEach(i => { i.disabled = sup; });
  document.getElementById('brandHint').textContent = sup
    ? 'An admin sees every brand.' : 'Pick at least one.';
}
document.getElementById('newRole').onchange = newRoleChanged;

const modal = document.getElementById('addModal'), scrim = document.getElementById('scrim');
function mmsg(text, kind){
  const m = document.getElementById('modalMsg');
  m.className = 'msg' + (kind ? ' ' + kind : '');
  m.textContent = text || '';
}
function openAdd(){
  if(!LOADED) return msg('Wait for the list to load before adding anyone.', 'err');
  /* Every field back to its default: a dialog that reopens holding the last person's
     details is how the wrong brand gets ticked for someone. */
  document.getElementById('newName').value = '';
  document.getElementById('newEmail').value = '';
  document.getElementById('newRole').value = 'viewer';
  nb.querySelectorAll('input').forEach(i => {
    i.checked = false; i.parentElement.classList.remove('on'); });
  newRoleChanged(); mmsg('');
  scrim.hidden = false; modal.hidden = false;
  document.getElementById('newName').focus();
}
function closeAdd(){ modal.hidden = true; scrim.hidden = true; }
document.getElementById('openAdd').onclick = openAdd;
document.getElementById('cancelAdd').onclick = closeAdd;
scrim.onclick = closeAdd;
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !modal.hidden) closeAdd();
});

document.getElementById('add').onclick = () => {
  const name = document.getElementById('newName').value.trim();
  const email = document.getElementById('newEmail').value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))
    return mmsg('That does not look like an email address.', 'err');
  if(USERS.some(u => u.email === email))
    return mmsg(email + ' is already on the list.', 'err');
  const role = document.getElementById('newRole').value;
  const brands = role === 'super' ? BRANDS.map(b => b.key)
    : [...nb.querySelectorAll('input:checked')].map(i => i.dataset.new);
  if(!brands.length) return mmsg('Pick at least one brand.', 'err');
  USERS.push({name, email, brands, role, by: '', at: 0});
  closeAdd(); draw(); mark(true);
  msg(name || email + ' added. Save to apply.', 'info');
};
/* Enter submits from either text field — the dialog has one obvious action. */
for(const id of ['newName', 'newEmail']){
  document.getElementById(id).addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('add').click(); }
  });
}

document.getElementById('save').onclick = async () => {
  const btn = document.getElementById('save');
  btn.disabled = true; msg('Saving…', 'info');
  try{
    const r = await fetch('/api/users', {method:'PUT',
      headers:{'Content-Type':'application/json'},
      /* Bootstrap rows go too. Their role and brands are forced back on the server,
         so nothing here can demote them — but their NAME is not a permission, and
         filtering them out was silently discarding it. */
      body: JSON.stringify({users: USERS.filter(u => !u.drop)})});
    const j = await r.json();
    if(!r.ok){ msg(j.error || 'Could not save.', 'err'); btn.disabled = false; return; }
    USERS = j.users; draw(); mark(false);
    msg('Saved. Anyone added can sign in now; anyone removed loses access within a '
        + 'minute.', 'ok');
  }catch(e){
    msg('Could not reach the server. Nothing was changed.', 'err');
    btn.disabled = false;
  }
};

/* A page that says "Nobody yet" because a network call failed invites someone to add
   themselves back and save, which is exactly how the list gets wiped. So the failure
   says so, and Add refuses until the list is really loaded. */
(async () => {
  try{
    const r = await fetch('/api/users');
    const j = await r.json();
    if(!r.ok) return msg(j.error || 'Could not load the list.', 'err');
    USERS = j.users || [];
    draw();
    if(!j.store)
      msg('No history store is configured, so this list cannot be saved. Access falls '
          + 'back to the addresses set in the environment.', 'err');
    else if(!j.store_ok)
      msg('The stored list could not be read just now, so what you see may be '
          + 'incomplete. Do not save until this page loads it.', 'err');
    else LOADED = true;
  }catch(e){ msg('Could not load the list.', 'err'); }
})();
</script>
