# Push-to-deploy, to Cloud Run.
#
# Was Render. The workspace was suspended on 2026-09-09 for exceeding the free
# bandwidth allowance, which takes every free service in it down until the calendar
# month rolls -- so the dashboard moved to Cloud Run in the project that already holds
# its GCS history bucket, and this workflow followed it.
#
# NO SERVICE ACCOUNT KEY. The org policy iam.disableServiceAccountKeyCreation forbids
# downloadable keys, which is the same constraint that forced history-service to exist.
# Authentication is Workload Identity Federation: GitHub mints an OIDC token, Google
# trades it for short-lived credentials, and the provider only accepts tokens whose
# `repository` claim is this repo. Nothing long-lived is stored in GitHub secrets.

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    # Documentation does not ship to the running service, and a needless deploy costs a
    # container build. Code changes still deploy on every push.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:        # and a manual button, for a docs-only push you DO want live

concurrency:
  group: cloudrun-deploy
  cancel-in-progress: false   # never cancel a deploy mid-flight; queue behind it

permissions:
  contents: read
  id-token: write             # required to mint the OIDC token WIF exchanges

env:
  PROJECT: admanagementpostly
  REGION: asia-south1
  SERVICE: ads-performance-dashboard

jobs:
  deploy:
    if: github.repository == 'krishnaprasun/postly-cpt-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/360124450287/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: gh-deploy-cpt@admanagementpostly.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Env vars are NOT passed here on purpose: the service already carries 35 of them
      # and `gcloud run deploy` leaves untouched any it is not told about. Passing a
      # partial set would silently delete the rest.
      - name: Deploy
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT" \
            --update-env-vars "GIT_COMMIT=${GITHUB_SHA}" \
            --quiet

      # A 200 does not prove the deploy landed -- during a roll the old revision is still
      # serving. /health reports the commit it was built from, so this compares it with
      # the sha that was pushed and fails loudly if traffic has not moved.
      - name: Verify the new revision is serving
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" \
                  --project "$PROJECT" --format='value(status.url)')
          for i in $(seq 1 20); do
            got=$(curl -fsS --max-time 30 "$URL/health" | python3 -c \
              'import json,sys; print(json.load(sys.stdin).get("commit",""))' || true)
            if [ "$got" = "${GITHUB_SHA}" ]; then
              echo "live on ${GITHUB_SHA:0:7}"; exit 0
            fi
            echo "  serving '${got:0:7}', waiting for ${GITHUB_SHA:0:7} ($i/20)"
            sleep 15
          done
          echo "::error::Cloud Run never served ${GITHUB_SHA:0:7}"; exit 1
